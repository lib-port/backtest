[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtester-prod"
version = "2.0.0"
description = "Deterministic event-driven backtesting and research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
service = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.35,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "opentelemetry-instrumentation-fastapi>=0.56b0,<1",
  "opentelemetry-sdk>=1.35,<2",
  "prometheus-client>=0.22,<1",
  "PyJWT[crypto]>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-python-dateutil",
  "hypothesis>=6.0,<7",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
]

[project.scripts]
quant-backtester = "quant_backtester.cli:main"
quant-backtester-api = "quant_backtester.service.api:main"
quant-backtester-worker = "quant_backtester.service.worker:main"
quant-backtester-db-bootstrap = "quant_backtester.persistence.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: tests that require external infrastructure",
]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["quant_backtester"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["quant_backtester"]
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "pandas", "yaml", "uvicorn"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
